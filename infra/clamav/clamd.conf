# Private ingress only. A processing-limit hit must fail closed.
Foreground yes
User clamav
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
MaxThreads 2
MaxQueue 8
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 100M
MaxScanTime 20000
MaxRecursion 8
MaxFiles 1000
MaxEmbeddedPE 10M
AlertExceedsMax yes
