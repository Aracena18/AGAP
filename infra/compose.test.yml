name: agap-platform-tests
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agap_owner
      POSTGRES_PASSWORD: development-owner
      POSTGRES_DB: agap_test
    ports: ['127.0.0.1:${AGAP_TEST_DATABASE_PORT:-55433}:5432']
    tmpfs: ['/var/lib/postgresql']
    volumes: ['./postgres/init.sql:/docker-entrypoint-initdb.d/000-roles.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agap_owner -d agap_test']
      interval: 1s
      timeout: 3s
      retries: 30
