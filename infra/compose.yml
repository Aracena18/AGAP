name: agap-platform
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agap_owner
      POSTGRES_PASSWORD: development-owner
      POSTGRES_DB: agap
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - database:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/000-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agap_owner -d agap']
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    profiles: [identity]
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database/keycloak
      KC_DB_USERNAME: agap_owner
      KC_DB_PASSWORD: development-owner
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: development-admin
    ports: ['127.0.0.1:58080:8080']
    depends_on:
      database:
        condition: service_healthy
    volumes: ['./keycloak:/opt/keycloak/data/import:ro']
volumes:
  database:
